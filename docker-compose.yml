version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./gateway/.env
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-localhost}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-flowforge-12345}
      - AZURE_KEYVAULT_URL=${AZURE_KEYVAULT_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./auth-service/.env
    environment:
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-flowforge-12345}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-flowforge-internal-secret-key-change-in-prod}
      - AZURE_KEYVAULT_URL=${AZURE_KEYVAULT_URL:-}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - ENTRA_GROUP_PLATFORM_ADMIN=${ENTRA_GROUP_PLATFORM_ADMIN:-}
      - ENTRA_GROUP_ORG_OWNER=${ENTRA_GROUP_ORG_OWNER:-}
      - ENTRA_GROUP_MANAGER=${ENTRA_GROUP_MANAGER:-}
      - ENTRA_GROUP_MEMBER=${ENTRA_GROUP_MEMBER:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  project-service:
    build: ./project-service
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    env_file:
      - ./project-service/.env
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-flowforge-internal-secret-key-change-in-prod}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5


  task-service:
    build: ./task-service
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      project-service:
        condition: service_started
    env_file:
      - ./task-service/.env
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-flowforge-internal-secret-key-change-in-prod}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  analysis-service:
    build: ./analysis-service
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./analysis-service/.env
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-flowforge-internal-secret-key-change-in-prod}
      - AZURE_KEYVAULT_URL=${AZURE_KEYVAULT_URL:-}
      - AZURE_FOUNDRY_ENDPOINT=${AZURE_FOUNDRY_ENDPOINT:-}
      - AZURE_FOUNDRY_KEY=${AZURE_FOUNDRY_KEY:-}
      - AZURE_FOUNDRY_DEPLOYMENT=${AZURE_FOUNDRY_DEPLOYMENT:-summary-agent}
      - AZURE_FOUNDRY_USE_MANAGED_IDENTITY=${AZURE_FOUNDRY_USE_MANAGED_IDENTITY:-false}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:-}
      - AZURE_STORAGE_ACCOUNT_NAME=${AZURE_STORAGE_ACCOUNT_NAME:-}
      - AZURE_STORAGE_USE_MANAGED_IDENTITY=${AZURE_STORAGE_USE_MANAGED_IDENTITY:-false}
      - AZURE_STORAGE_CONTAINER=${AZURE_STORAGE_CONTAINER:-flowforge-reports}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  notification-worker:
    build: ./notification-worker
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./notification-worker/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - BASE_PUBLIC_URL=${PUBLIC_IP:-localhost}
        - NEXT_PUBLIC_ENTRA_CLIENT_ID=${NEXT_PUBLIC_ENTRA_CLIENT_ID:-}
        - NEXT_PUBLIC_ENTRA_TENANT_ID=${NEXT_PUBLIC_ENTRA_TENANT_ID:-}
        - NEXT_PUBLIC_ENTRA_REDIRECT_URI=${NEXT_PUBLIC_ENTRA_REDIRECT_URI:-http://localhost:3000}
    ports:
      - "3000:3000"
    environment:
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway

  # ── Nginx SSL Termination (optional — enable for production) ──
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - gateway
    profiles:
      - ssl

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    profiles:
      - ssl

volumes:
  postgres_data:
  redis_data:
  certbot-data:
  certbot-webroot:
