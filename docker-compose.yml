version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./k8s/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./gateway/.env
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-localhost}
      - PUBLIC_KEY_PATH=/app/keys/public.pem
    volumes:
      - ./public.pem:/app/keys/public.pem:ro

  auth-service:
    build: ./auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./auth-service/.env
    volumes:
      - ./public.pem:/app/keys/public.pem:ro
      - ./private.pem:/app/keys/private.pem:ro

  project-service:
    build: ./project-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./project-service/.env

  task-service:
    build: ./task-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./task-service/.env

  analysis-service:
    build: ./analysis-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./analysis-service/.env

  frontend:
    build:
      context: ./frontend
      args:
        - BASE_PUBLIC_URL=${PUBLIC_IP:-localhost}
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
