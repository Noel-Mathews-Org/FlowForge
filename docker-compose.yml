version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./gateway/.env
    environment:
      - PUBLIC_IP=${PUBLIC_IP:-localhost}
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-flowforge-12345}

  auth-service:
    build: ./auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./auth-service/.env
    environment:
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-for-flowforge-12345}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-flowforge-internal-secret-key-change-in-prod}

  project-service:
    build: ./project-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    env_file:
      - ./project-service/.env
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-flowforge-internal-secret-key-change-in-prod}

  task-service:
    build: ./task-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      project-service:
        condition: service_started
    env_file:
      - ./task-service/.env
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-flowforge-internal-secret-key-change-in-prod}

  analysis-service:
    build: ./analysis-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./analysis-service/.env
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-flowforge-internal-secret-key-change-in-prod}
      - AZURE_FOUNDRY_ENDPOINT=${AZURE_FOUNDRY_ENDPOINT:-}
      - AZURE_FOUNDRY_KEY=${AZURE_FOUNDRY_KEY:-}
      - AZURE_FOUNDRY_DEPLOYMENT=${AZURE_FOUNDRY_DEPLOYMENT:-gpt-35-turbo}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-3.5-turbo}

  notification-worker:
    build: ./notification-worker
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./notification-worker/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - BASE_PUBLIC_URL=${PUBLIC_IP:-localhost}
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
