apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowforge-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Noel-Mathews-Org/FlowForge.git'
    targetRevision: test
    path: k8s/dashboards
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
