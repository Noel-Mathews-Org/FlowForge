apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flowforge-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Noel-Mathews-Org/FlowForge.git'
    targetRevision: test
    path: Helm
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
