apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: keycloak-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 10.0.1.27
    path: /var/nfs/flowforge/keycloak
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  namespace: keycloak
spec:
  storageClassName: ""
  volumeName: keycloak-pv
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: NodePort
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        fsGroup: 0
        runAsUser: 0
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.1.4
          args:
            - start-dev
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: PayCrest@Keycloak2026
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: "https://keycloak.flowforge.fun"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 15
      volumes:
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: keycloak-data
---
# 1. NOEL MATHEWS (Full Cluster Admin)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: Group
  name: "oidc:cluster-admins"
  apiGroup: rbac.authorization.k8s.io
---
# 2. READONLY ROLE FOR TEAMS
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flowforge-readonly
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]
---
# 3. DEV TEAM (Restricted to 'dev' namespace only)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-dev-team-binding
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flowforge-readonly
subjects:
- kind: Group
  name: "oidc:dev-team"
  apiGroup: rbac.authorization.k8s.io
---
# 4. TEST TEAM (Restricted to 'dev' namespace only)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-test-team-binding
  namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flowforge-readonly
subjects:
- kind: Group
  name: "oidc:test-team"
  apiGroup: rbac.authorization.k8s.io
---
# 5. ALLOW TEAMS TO LIST NAMESPACES (Required for Headlamp UI)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flowforge-namespace-lister
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-teams-namespace-list
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flowforge-namespace-lister
subjects:
- kind: Group
  name: "oidc:dev-team"
  apiGroup: rbac.authorization.k8s.io
- kind: Group
  name: "oidc:test-team"
  apiGroup: rbac.authorization.k8s.io
