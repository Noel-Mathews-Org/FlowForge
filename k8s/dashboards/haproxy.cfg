global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 4096
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s
    option  forwardfor
    option  http-server-close

userlist monitoring_users
    user admin insecure-password adminfire321
    user noel insecure-password noelmc123

frontend http_redirect
    bind *:80
    mode http
    redirect scheme https code 301

frontend https_front
    bind *:443 ssl crt /etc/ssl/private/flowforge.fun.pem
    mode http
    option forwardfor
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Define ACLs for monitoring basic auth requirement
    acl host_prometheus hdr(host) -i prometheus.flowforge.fun
    acl host_rollouts   hdr(host) -i rollouts.flowforge.fun

    acl auth_ok http_auth(monitoring_users)

    # Basic Auth enforcement
    http-request auth realm "FlowForge Monitoring" if host_prometheus !auth_ok
    http-request auth realm "FlowForge Monitoring" if host_rollouts !auth_ok
    http-request auth realm "FlowForge Monitoring" if host_loki !auth_ok

    # Everything gets sent to KGateway!
    acl host_sonar hdr(host) -i sonar.flowforge.fun
    use_backend sonar_back if host_sonar

    # Everything else gets sent to KGateway!
    default_backend kgateway_back

backend kgateway_back
    mode http
    balance roundrobin
    option forwardfor
    server worker1 10.0.1.102:30639 check
    server worker2 10.0.1.245:30639 check
    server worker3 10.0.1.85:30639 check


backend sonar_back
    mode http
    balance roundrobin
    server sonar 10.0.1.248:9000 check
