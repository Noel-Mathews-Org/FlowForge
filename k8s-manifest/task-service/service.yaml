apiVersion: v1
kind: Service
metadata:
  name: flowforge-dev-task-service-active
  namespace: default
spec:
  selector:
    app: flowforge-dev-task-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-dev-task-service-preview
  namespace: default
spec:
  selector:
    app: flowforge-dev-task-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: default
spec:
  selector:
    app: flowforge-dev-task-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8003
