---
# Source: flowforge/charts/gateway/templates/rollout.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: flowforge-dev-gateway
  namespace: default
spec:
  replicas: 2
  strategy:
    canary:
      steps:
      - setWeight: 50
      - pause: {}
  selector:
    matchLabels:
      app: flowforge-dev-gateway
  template:
    metadata:
      labels:
        tier: gateway
        app: flowforge-dev-gateway
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - flowforge-dev-gateway
            topologyKey: "kubernetes.io/hostname"
      serviceAccountName: flowforge-dev-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: gateway
          image: "ghcr.io/noel-mathews-org/flowforge/gateway:a97a9b2"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: flowforge-config
            - secretRef:
                name: flowforge-secret
          env:

            - name: REDIS_URL
              value: "redis://redis.dev.svc.cluster.local:6379"
            - name: APP_PORT
              value: "8000"
            - name: GATEWAY_PORT
              value: "8000"
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
