apiVersion: v1
kind: Service
metadata:
  name: flowforge-dev-gateway-active
  namespace: default
spec:
  selector:
    app: flowforge-dev-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-dev-gateway-preview
  namespace: default
spec:
  selector:
    app: flowforge-dev-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: default
spec:
  selector:
    app: flowforge-dev-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
