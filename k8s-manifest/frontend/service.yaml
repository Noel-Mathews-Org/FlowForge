---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-dev-frontend-active
  namespace: default
spec:
  selector:
    app: flowforge-dev-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: flowforge-dev-frontend-preview
  namespace: default
spec:
  selector:
    app: flowforge-dev-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: default
spec:
  selector:
    app: flowforge-dev-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
