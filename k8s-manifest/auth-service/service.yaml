apiVersion: v1
kind: Service
metadata:
  name: flowforge-dev-auth-service-active
  namespace: default
spec:
  selector:
    app: flowforge-dev-auth-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
---

apiVersion: v1
kind: Service
metadata:
  name: flowforge-dev-auth-service-preview
  namespace: default
spec:
  selector:
    app: flowforge-dev-auth-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
---

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: default
spec:
  selector:
    app: flowforge-dev-auth-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8001
