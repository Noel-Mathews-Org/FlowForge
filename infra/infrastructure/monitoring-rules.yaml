apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flowforge-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus
spec:
  groups:
  - name: flowforge-application-alerts
    rules:
    - alert: ServiceDown
      expr: up{kubernetes_namespace=~"dev|prod"} == 0
      for: 2m
      labels: { severity: critical, category: application }
      annotations: 
        summary: "Service {{ $labels.kubernetes_name }} is DOWN"
        description: "Service is unreachable."
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total{namespace=~"dev|prod"}[15m]) * 60 > 5
      for: 5m
      labels: { severity: critical, category: application }
      annotations: { description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting frequently." }
  - name: flowforge-infrastructure-alerts
    rules:
    - alert: NodeDown
      expr: kube_node_status_condition{condition="Ready", status="true"} == 0
      for: 5m
      labels: { severity: critical, category: infrastructure }
      annotations: { description: "Node {{ $labels.node }} is NotReady." }
