name: Frontend CI

on:
  push:
    branches:
      - Cloud-Track-dev
    paths:
      - 'frontend/**'

permissions:
  contents: write
  id-token: write

jobs:
  run-ci:
    if: "!contains(github.event.head_commit.message, 'chore(gitops)')"
    uses: Noel-Mathews-Org/.github/.github/workflows/_ci-reusable.yml@main
    with:
      service_name: frontend
      project_key: Flow_frontend
    secrets: inherit

